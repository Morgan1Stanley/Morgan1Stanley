<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="pelican riding a bicycle">
  <title>pelican riding a bicycle</title>
  <defs>
    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1F"/>
      <stop offset="55%" stop-color="#0C1433"/>
      <stop offset="100%" stop-color="#061D2C"/>
    </linearGradient>
    <pattern id="pgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 H0 V26" fill="none" stroke="#7C5CFF" stroke-opacity="0.17"/>
    </pattern>
    <pattern id="pgridL" width="130" height="130" patternUnits="userSpaceOnUse">
      <path d="M130 0 H0 V130" fill="none" stroke="#22D3EE" stroke-opacity="0.22" stroke-width="1.1"/>
    </pattern>
    <linearGradient id="brd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#22D3EE" stop-opacity="0.75"/>
      <stop offset="80%" stop-color="#22D3EE" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pclip"><rect x="0" y="6" width="1200" height="178" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#pclip)">
    <rect x="0" y="6" width="1200" height="178" fill="url(#pg)"/>
    <rect x="0" y="6" width="1200" height="178" fill="url(#pgrid)"/>
    <rect x="0" y="6" width="1200" height="178" fill="url(#pgridL)"/>

    <!-- 路面：虚线滚动制造速度感 -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -64 0" dur="0.9s" repeatCount="indefinite"/>
      <line x1="-64" y1="150" x2="1264" y2="150" stroke="url(#road)" stroke-width="2.5" stroke-dasharray="34 30"/>
    </g>

    <!-- 骑行的鹈鹕：横穿整幅画面 -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="-200 60; 1400 60" dur="13s" repeatCount="indefinite"/>
      <ellipse cx="78" cy="150" rx="130" ry="17" fill="url(#glow)"/>
      <g transform="scale(0.46)">
        <g>
  <!-- 车轮 -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 62 168" to="360 62 168" dur="1.3s" repeatCount="indefinite"/>
    <circle cx="62" cy="168" r="32" fill="none" stroke="#DCE6F5" stroke-width="4.5"/>
    <g stroke="#8FA6C9" stroke-width="1.5" stroke-opacity="0.85">
      <line x1="62" y1="138" x2="62" y2="198"/>
      <line x1="30" y1="168" x2="94" y2="168"/>
      <line x1="30" y1="145" x2="94" y2="191"/>
      <line x1="94" y1="145" x2="30" y2="191"/>
    </g>
    <circle cx="62" cy="168" r="4" fill="#22D3EE"/>
    <circle cx="62" cy="137" r="3.2" fill="#7C5CFF"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 240 168" to="360 240 168" dur="1.3s" repeatCount="indefinite"/>
    <circle cx="240" cy="168" r="32" fill="none" stroke="#DCE6F5" stroke-width="4.5"/>
    <g stroke="#8FA6C9" stroke-width="1.5" stroke-opacity="0.85">
      <line x1="240" y1="138" x2="240" y2="198"/>
      <line x1="208" y1="168" x2="272" y2="168"/>
      <line x1="208" y1="145" x2="272" y2="191"/>
      <line x1="272" y1="145" x2="208" y2="191"/>
    </g>
    <circle cx="240" cy="168" r="4" fill="#22D3EE"/>
    <circle cx="240" cy="137" r="3.2" fill="#7C5CFF"/>
  </g>

  <!-- 车架 -->
  <g stroke="#7C5CFF" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M62,168 L140,168"/>
    <path d="M62,168 L122,116"/>
    <path d="M122,116 L140,168"/>
    <path d="M140,168 L214,112"/>
    <path d="M122,116 L214,112"/>
    <path d="M214,112 L240,168"/>
    <path d="M214,112 Q227,101 236,104"/>
  </g>
  <rect x="105" y="107" width="32" height="7" rx="3.5" fill="#1B1F3B"/>
  <!-- 曲柄与脚踏（跟随车轮同周期转动） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 140 168" to="360 140 168" dur="1.3s" repeatCount="indefinite"/>
    <line x1="140" y1="168" x2="140" y2="150" stroke="#C9D6E8" stroke-width="4.5"/>
    <line x1="140" y1="168" x2="140" y2="186" stroke="#C9D6E8" stroke-width="4.5"/>
    <rect x="131" y="145" width="18" height="5" rx="2.5" fill="#22D3EE"/>
    <rect x="131" y="186" width="18" height="5" rx="2.5" fill="#22D3EE"/>
    <circle cx="140" cy="168" r="5.5" fill="#7C5CFF"/>
  </g>
  <!-- 远侧腿 -->
  <g stroke="#C3D2E8" stroke-width="6.5" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate"
                      values="-15 152 114; 15 152 114; -15 152 114" dur="1.3s" repeatCount="indefinite"/>
    <path d="M152,114 L146,146 L141,188"/>
  </g>
  <!-- 尾羽 -->
  <path d="M126,86 L86,72 Q95,95 84,110 L128,108 Z" fill="#E4ECF8" stroke="#C3D2E8" stroke-width="1.2"/>
  <!-- 身体 -->
  <ellipse cx="158" cy="96" rx="45" ry="31" fill="#F2F6FC" stroke="#C3D2E8" stroke-width="1.5"/>
  <!-- 翅膀 -->
  <path d="M148,78 Q182,84 186,116 Q162,126 142,112 Z" fill="#E4ECF8" stroke="#C3D2E8" stroke-width="1.2"/>
  <!-- 脖子（粗短，鹈鹕特征） -->
  <path d="M184,78 Q206,68 214,52" stroke="#F2F6FC" stroke-width="25" stroke-linecap="round" fill="none"/>
  <!-- 头 -->
  <circle cx="219" cy="42" r="18" fill="#F2F6FC" stroke="#C3D2E8" stroke-width="1.5"/>
  <!-- 头盔 -->
  <path d="M201,34 A18,18 0 0 1 237,34 Z" fill="#7C5CFF"/>
  <path d="M236,32 L246,36 L236,40 Z" fill="#22D3EE"/>
  <!-- 上喙：细长、末端带钩 -->
  <path d="M232,34 L303,43 L298,51 L233,47 Z" fill="#F5A623"/>
  <path d="M296,44 L303,43.5 L298,51 Z" fill="#DE8B10"/>
  <!-- 喉囊：大幅下垂，鹈鹕标志 -->
  <path d="M233,47 Q250,89 292,77 Q303,63 298,50 Z" fill="#FBCF8A" stroke="#F5A623" stroke-width="1.4"/>
  <!-- 眼睛 -->
  <circle cx="226" cy="36" r="3.2" fill="#1B1F3B"/>
  <circle cx="227.2" cy="35" r="1" fill="#F2F6FC"/>
  <!-- 近侧腿 -->
  <g stroke="#DCE6F5" stroke-width="7" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="rotate"
                      values="15 152 114; -15 152 114; 15 152 114" dur="1.3s" repeatCount="indefinite"/>
    <path d="M152,114 L148,146 L140,150"/>
  </g>
</g>
      </g>
    </g>

    <!-- HUD 标签 -->
    <text x="24" y="34" font-family="Consolas, Menlo, Monaco, monospace" font-size="14"
          letter-spacing="3" fill="#22D3EE" fill-opacity="0.55">PELICAN × BICYCLE</text>
    <text x="1176" y="34" text-anchor="end" font-family="Consolas, Menlo, Monaco, monospace" font-size="12"
          letter-spacing="2" fill="#8EA2C6" fill-opacity="0.5">SELF-DRAWN · ANIMATED</text>
  </g>
  <rect x="0.6" y="6.6" width="1198.8" height="176.8" rx="16" fill="none" stroke="url(#brd)"/>
</svg>
